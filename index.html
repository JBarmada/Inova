<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5eddc" />
    <title>Inova</title>
    <link rel="stylesheet" href="/startup.css" />
    <link rel="preload" as="image" href="/dog/breathing/sitting-0.png" />
    <link rel="preload" as="image" href="/dog/breathing/sitting-1.png" />

  </head>
  <body>
    <div id="root"><main id="startup-loader" class="startup-screen" aria-busy="true">
      <h1>Inova</h1>
      <div class="startup-pup" role="img" aria-label="A little pixel dog breathing quietly"></div>
      <div class="startup-paws" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges"><path d="M4 1h3v4H4zM9 1h3v4H9zM0 5h3v4H0zM13 5h3v4h-3zM6 7h4v2h2v2h1v3H3v-3h1V9h2z"/></svg>
        <svg viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges"><path d="M4 1h3v4H4zM9 1h3v4H9zM0 5h3v4H0zM13 5h3v4h-3zM6 7h4v2h2v2h1v3H3v-3h1V9h2z"/></svg>
        <svg viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges"><path d="M4 1h3v4H4zM9 1h3v4H9zM0 5h3v4H0zM13 5h3v4h-3zM6 7h4v2h2v2h1v3H3v-3h1V9h2z"/></svg>
      </div>
      <p id="startup-stage" role="status" aria-live="polite">Fetching your world…</p>
      <p id="startup-slow" class="startup-slow" hidden>This is taking longer than usual. Your saved world is still being opened.</p>
      <button id="startup-retry" type="button" hidden>Try again</button>
    </main></div>
    <script src="/startup.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
